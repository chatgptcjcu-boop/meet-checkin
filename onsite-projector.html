<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場簽到 QR｜投影用</title>
  <script src="config/event.config.js"></script>
  <script src="config/apply-event-config.js"></script>
  <script src="config/event-resolver.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
      background: #fff;
      color: #0f172a;
      overflow: hidden;
    }
    .stage {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      padding: 2.5vh 4vw;
      gap: 2vh;
      text-align: center;
    }
    .org { font-size: clamp(1rem, 2.2vw, 1.35rem); color: #475569; letter-spacing: 0.15em; font-weight: 500; }
    h1 { font-size: clamp(1.6rem, 4.5vw, 3rem); font-weight: 900; line-height: 1.25; margin-top: 0.5vh; }
    .date { font-size: clamp(1.1rem, 2.8vw, 1.75rem); font-weight: 700; color: #047857; margin-top: 0.5vh; }
    .qr-block { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .qr-wrap {
      border: 6px solid #047857;
      border-radius: 20px;
      padding: clamp(12px, 2vw, 24px);
      background: #fff;
      box-shadow: 0 8px 40px rgb(4 120 87 / 0.15);
    }
    .qr-wrap img, .qr-wrap canvas {
      display: block;
      width: clamp(220px, 42vmin, 520px);
      height: clamp(220px, 42vmin, 520px);
    }
    .scan { font-size: clamp(1.4rem, 3.5vw, 2.5rem); font-weight: 900; color: #047857; margin-top: 2vh; }
    .steps { font-size: clamp(0.95rem, 2vw, 1.35rem); line-height: 1.65; color: #334155; max-width: 90vw; }
    .steps strong { color: #047857; }
    .hint { font-size: clamp(0.8rem, 1.5vw, 1rem); color: #94a3b8; margin-top: 1vh; }
    .toolbar {
      position: fixed; top: 1rem; right: 1rem; padding: 0.65rem;
      display: flex; align-items: center; gap: 0.45rem; z-index: 10;
      background: rgb(255 255 255 / 0.95); border: 1px solid #cbd5e1; border-radius: 10px;
      box-shadow: 0 4px 16px rgb(15 23 42 / 0.12);
    }
    .toolbar label { font-size: 0.75rem; color: #475569; font-weight: 700; }
    .toolbar input { font: inherit; font-size: 0.82rem; padding: 0.35rem; border: 1px solid #94a3b8; border-radius: 6px; color: #0f172a; }
    .toolbar a, .toolbar button {
      font-size: 0.72rem; padding: 0.35rem 0.65rem; border-radius: 6px;
      border: 1px solid #cbd5e1; background: #f8fafc; color: #334155;
      text-decoration: none; cursor: pointer; font-family: inherit;
    }
    @media print { .toolbar { display: none; } .stage { min-height: auto; padding: 15mm; } }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <label for="eventDatePicker">會議日期</label>
    <input id="eventDatePicker" type="date" aria-label="選擇會議日期">
    <a href="./onsite-qr-print.html">列印版</a>
    <a id="checkinLink" href="./onsite-checkin/">簽到頁</a>
    <button type="button" onclick="document.documentElement.requestFullscreen?.()">全螢幕</button>
  </div>
  <div class="stage">
    <header>
      <p class="org" data-event="org.headerLine">臺灣道法總會｜教育委員會</p>
      <h1 data-event="event.title">會議現場簽到</h1>
      <p class="date" data-event-date-line>—｜現場簽到</p>
    </header>
    <div class="qr-block">
      <div class="qr-wrap" id="dynamicQrCode">
        <img src="./assets/onsite-qrcode.png" alt="現場簽到 QR Code" width="520" height="520">
      </div>
      <p class="scan">請掃描 QR Code 完成簽到</p>
    </div>
    <footer>
      <p class="steps">
        <strong data-sign-in-label="committee">評核委員</strong>：名單點選姓名　｜
        <strong>其他現場人員</strong>：選身份別 → 填姓名 → 拍照
      </p>
      <p class="hint">會議結束請再次掃描完成簽退</p>
    </footer>
  </div>
  <script>
    var QR_ENTRY_URL = 'https://chatgptcjcu-boop.github.io/meet-checkin/';
    var picker = document.getElementById('eventDatePicker');
    var qrBlock = document.querySelector('.qr-block');
    var checkinLink = document.getElementById('checkinLink');

    function renderEventQr(presetId) {
      var target = QR_ENTRY_URL + '?event=' + encodeURIComponent(presetId);
      var container = document.getElementById('dynamicQrCode');
      container.innerHTML = '';
      new QRCode(container, {
        text: target,
        width: 520,
        height: 520,
        correctLevel: QRCode.CorrectLevel.M
      });
      checkinLink.href = './onsite-checkin/?event=' + encodeURIComponent(presetId);
    }

    function showUnavailable(dateIso) {
      document.querySelector('[data-event="event.title"]').textContent = '此日期尚無排定會議';
      document.querySelector('[data-event-date-line]').textContent = dateIso + '｜請選擇已建立的會議日期';
      qrBlock.style.visibility = 'hidden';
      checkinLink.href = './onsite-checkin/';
    }

    function loadSelectedDate(dateIso) {
      window.MeetCheckinEventResolver.resolve({ dateIso: dateIso })
        .then(function (result) {
          if (!result.ok) {
            showUnavailable(dateIso);
            return;
          }
          qrBlock.style.visibility = 'visible';
          MeetCheckinConfig.init({ meta: false });
          renderEventQr(result.presetId);
        })
        .catch(function () { showUnavailable(dateIso); });
    }

    picker.value = window.MeetCheckinEventResolver.taiwanDateIso();
    picker.addEventListener('change', function () { loadSelectedDate(picker.value); });
    loadSelectedDate(picker.value);
  </script>
</body>
</html>
