<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場簽到 QR｜投影用</title>
  <script src="config/event.config.js"></script>
  <script src="config/apply-event-config.js"></script>
  <script src="config/event-resolver.js?v=5"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
      background: #fff;
      color: #0f172a;
      overflow: hidden;
    }
    .stage {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      padding: clamp(8.25rem, 12vh, 9.75rem) 4vw 2.5vh;
      gap: 1.25vh;
      text-align: center;
    }
    .org { font-size: clamp(0.95rem, 1.8vw, 1.25rem); color: #475569; letter-spacing: 0.12em; font-weight: 700; }
    h1 { max-width: min(92vw, 1420px); font-size: clamp(1.75rem, 3.35vw, 3.1rem); font-weight: 900; line-height: 1.18; margin: 0.45vh auto 0; }
    .date { font-size: clamp(1.1rem, 2.8vw, 1.75rem); font-weight: 700; color: #047857; margin-top: 0.5vh; }
    .qr-block { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .qr-wrap {
      border: 6px solid #047857;
      border-radius: 20px;
      padding: clamp(12px, 2vw, 24px);
      background: #fff;
      box-shadow: 0 8px 40px rgb(4 120 87 / 0.15);
    }
    .qr-wrap img, .qr-wrap canvas {
      display: block;
      width: clamp(220px, 39vmin, 480px);
      height: clamp(220px, 39vmin, 480px);
    }
    .scan { font-size: clamp(1.4rem, 3.5vw, 2.5rem); font-weight: 900; color: #047857; margin-top: 2vh; }
    .steps { font-size: clamp(0.95rem, 2vw, 1.35rem); line-height: 1.65; color: #334155; max-width: 90vw; }
    .steps strong { color: #047857; }
    .hint { font-size: clamp(0.8rem, 1.5vw, 1rem); color: #94a3b8; margin-top: 1vh; }
    .toolbar {
      position: fixed; top: 1.1rem; right: 1.25rem; padding: 0.55rem 0.65rem;
      display: flex; align-items: center; gap: 0.45rem; z-index: 10;
      background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px;
      box-shadow: 0 8px 24px rgb(15 23 42 / 0.10);
    }
    .toolbar label { font-size: 0.78rem; color: #475569; font-weight: 900; white-space: nowrap; }
    .toolbar input { font: inherit; font-size: 0.84rem; padding: 0.43rem 0.5rem; border: 1px solid #94a3b8; border-radius: 8px; color: #0f172a; background: #fff; }
    .toolbar a, .toolbar button {
      font-size: 0.78rem; font-weight: 700; white-space: nowrap; padding: 0.45rem 0.7rem; border-radius: 8px;
      border: 1px solid #cbd5e1; background: #f8fafc; color: #334155;
      text-decoration: none; cursor: pointer; font-family: inherit; transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }
    .toolbar a:hover, .toolbar button:hover { background: #ecfdf5; border-color: #6ee7b7; color: #047857; }
    .toolbar a:focus-visible, .toolbar button:focus-visible, .toolbar input:focus-visible, .event-choice:focus-visible { outline: 3px solid rgb(5 150 105 / 0.3); outline-offset: 2px; }
    .event-choices {
      position: fixed; left: 1.25rem; top: 1.1rem; z-index: 10; width: min(44rem, calc(100vw - 38rem));
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.38rem; padding: 0.55rem 0.65rem 0.65rem;
      background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px;
      box-shadow: 0 8px 24px rgb(15 23 42 / 0.10);
    }
    .event-choices strong { grid-column: 1 / -1; font-size: 0.76rem; color: #475569; text-align: left; }
    .event-choice {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      border: 1px solid #86efac; background: #f0fdf4; color: #166534; border-radius: 8px;
      padding: 0.46rem 0.42rem; cursor: pointer; font: 700 0.76rem inherit;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }
    .event-choice:hover, .event-choice.is-selected { background: #15803d; border-color: #15803d; color: #fff; }
    .event-choice:active, .toolbar a:active, .toolbar button:active { transform: translateY(1px); }
    @media (max-width: 1100px) {
      .event-choices { width: min(35rem, calc(100vw - 27rem)); grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stage { padding-top: clamp(13rem, 30vh, 15.5rem); }
      .qr-wrap img, .qr-wrap canvas { width: clamp(210px, 36vmin, 410px); height: clamp(210px, 36vmin, 410px); }
    }
    @media (max-width: 720px) {
      html, body { overflow: auto; }
      .event-choices { position: static; width: auto; margin: 0.75rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { position: static; width: auto; margin: 0.75rem; flex-wrap: wrap; justify-content: center; }
      .stage { min-height: auto; padding: 1.5rem 1rem 2rem; }
    }
    @media print { .no-print { display: none !important; } .stage { min-height: auto; padding: 15mm; } }
  </style>
</head>
<body>
  <div id="eventChoices" class="event-choices no-print" aria-label="已建立會議"></div>
  <div class="toolbar no-print">
    <label for="eventDatePicker">會議日期</label>
    <input id="eventDatePicker" type="date" aria-label="選擇會議日期">
    <a href="./onsite-qr-print.html">列印版</a>
    <a id="checkinLink" href="./onsite-checkin/">簽到頁</a>
    <button type="button" onclick="document.documentElement.requestFullscreen?.()">全螢幕</button>
  </div>
  <div class="stage">
    <header>
      <p class="org" data-event="org.headerLine">臺灣道法總會｜教育委員會</p>
      <h1 data-event="event.title">會議現場簽到</h1>
      <p class="date" data-event-date-line>尚未設定日期｜現場簽到</p>
    </header>
    <div class="qr-block">
      <div class="qr-wrap" id="dynamicQrCode">
        <img src="./assets/onsite-qrcode.png" alt="現場簽到 QR Code" width="520" height="520">
      </div>
      <p class="scan">請掃描 QR Code 完成簽到</p>
    </div>
    <footer>
      <p class="steps">
        <strong data-sign-in-label="committee">評核委員</strong>：名單點選姓名　｜
        <strong>其他現場人員</strong>：選身份別 → 填姓名 → 拍照
      </p>
      <p class="hint">會議結束請再次掃描完成簽退</p>
    </footer>
  </div>
  <script>
    var QR_ENTRY_URL = 'https://chatgptcjcu-boop.github.io/meet-checkin/';
    var picker = document.getElementById('eventDatePicker');
    var qrBlock = document.querySelector('.qr-block');
    var checkinLink = document.getElementById('checkinLink');

    function renderEventQr(presetId) {
      var target = QR_ENTRY_URL + '?event=' + encodeURIComponent(presetId);
      var container = document.getElementById('dynamicQrCode');
      container.innerHTML = '';
      new QRCode(container, {
        text: target,
        width: 520,
        height: 520,
        correctLevel: QRCode.CorrectLevel.M
      });
      checkinLink.href = './onsite-checkin/?event=' + encodeURIComponent(presetId);
    }

    function showUnavailable(dateIso) {
      document.querySelector('[data-event="event.title"]').textContent = '此日期尚無排定會議';
      document.querySelector('[data-event-date-line]').textContent = dateIso + '｜請選擇已建立的會議日期';
      qrBlock.style.visibility = 'hidden';
      checkinLink.href = './onsite-checkin/';
    }

    function loadSelectedDate(dateIso) {
      window.MeetCheckinEventResolver.resolve({ dateIso: dateIso })
        .then(function (result) {
          if (!result.ok) {
            showUnavailable(dateIso);
            return;
          }
          qrBlock.style.visibility = 'visible';
          MeetCheckinConfig.init({ meta: false });
          renderEventQr(result.presetId);
          document.querySelectorAll('.event-choice').forEach(function (button) {
            var selected = button.dataset.date === dateIso;
            button.classList.toggle('is-selected', selected);
            button.setAttribute('aria-pressed', selected ? 'true' : 'false');
          });
        })
        .catch(function () { showUnavailable(dateIso); });
    }

    var requestedPresetId = new URLSearchParams(window.location.search).get('event');
    var requestedEvent = window.MeetCheckinEventResolver.events.filter(function (event) {
      return event.presetId === requestedPresetId;
    })[0];
    picker.value = requestedEvent ? requestedEvent.dateIso : window.MeetCheckinEventResolver.taiwanDateIso();
    picker.addEventListener('change', function () { loadSelectedDate(picker.value); });
    window.MeetCheckinEventResolver.events.forEach(function (event) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'event-choice';
      button.dataset.date = event.dateIso;
      button.textContent = event.shortLabel || event.label;
      button.title = event.label;
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', function () {
        picker.value = event.dateIso;
        loadSelectedDate(event.dateIso);
      });
      document.getElementById('eventChoices').appendChild(button);
    });
    var eventChoicesTitle = document.createElement('strong');
    eventChoicesTitle.textContent = '快速選擇已建立會議';
    document.getElementById('eventChoices').prepend(eventChoicesTitle);
    loadSelectedDate(picker.value);
  </script>
</body>
</html>
